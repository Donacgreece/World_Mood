    <title>Moodaro · Feel the world together</title>
    <script>
      try {
        const theme = localStorage.getItem('worldmood-theme') || 'system';
        const dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]')?.setAttribute('content', dark ? '#10152f' : '#f5f6ff');
      } catch (_) {}
    </script>
